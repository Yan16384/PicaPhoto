<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2e58e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PicaPhoto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f2f3f5; --card:#fff; --fg:#1f2329; --sub:#8a919f; --line:#e4e6eb;
  --accent:#2e58e8; --accent-soft:#eef3ff; --green:#07c160; --danger:#e54545;
  --bar-h:56px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --r:14px;
}
[data-theme="dark"]{
  --bg:#17181c; --card:#262931; --fg:#f2f4f8; --sub:#9aa3b2; --line:#333844;
  --accent:#4d8dff; --accent-soft:#1f2c47; --green:#2fd08a; --danger:#ff6b6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{overflow:hidden;touch-action:manipulation}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
/* 顶部栏 */
#topbar{position:fixed;top:0;left:0;right:0;z-index:50;height:calc(var(--bar-h) + var(--safe-t));
  padding:var(--safe-t) 16px 0;display:flex;align-items:center;gap:10px;
  background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);transition:opacity .25s,transform .25s}
#topbar .logo{width:30px;height:30px;border-radius:8px;flex:none}
#topbar h1{font-size:17px;font-weight:700;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tb-btn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:18px;background:var(--card);border:1px solid var(--line)}
/* 主体 */
main{position:fixed;inset:calc(var(--bar-h) + var(--safe-t)) 0 calc(var(--bar-h) + var(--safe-b));overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 24px;
  display:none;will-change:transform,opacity}
.view.active{display:block}
/* 相册卡片 */
.alb-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.alb{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  transition:transform .12s;touch-action:manipulation}
.alb:active{transform:scale(.97)}
.alb .cover{width:100%;aspect-ratio:4/3;background:var(--accent-soft);position:relative}
.alb .cover img{width:100%;height:100%;object-fit:cover;display:block}
.alb .meta{padding:10px 12px}
.alb .name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alb .cnt{font-size:12px;color:var(--sub);margin-top:2px}
/* 照片网格 */
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.ph{aspect-ratio:1;background:var(--card);border-radius:6px;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ph .sel{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;
  background:var(--accent);color:#fff;display:none;align-items:center;justify-content:center;font-size:13px}
.ph.multi .sel{display:flex}
.ph.sel-on{outline:3px solid var(--accent);outline-offset:-3px}
.ph .dur{position:absolute;right:4px;bottom:4px;font-size:10px;color:#fff;background:rgba(0,0,0,.55);
  padding:1px 5px;border-radius:6px}
/* 空状态 */
.empty{padding:60px 24px;text-align:center;color:var(--sub)}
.empty .big{font-size:56px;margin-bottom:12px}
/* 底部导航 */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--bar-h) + var(--safe-b));
  padding-bottom:var(--safe-b);display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11px;color:var(--sub)}
.tab .ic{font-size:21px;line-height:1}
.tab.on{color:var(--accent);font-weight:600}
/* 大按钮 */
.big-btn{margin:12px;height:52px;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 24px)}
.big-btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}
/* 全屏查看器 */
#viewer{position:fixed;inset:0;background:#000;z-index:100;display:none}
#viewer.open{display:block}
#viewer .track{position:absolute;inset:0;display:flex;align-items:stretch}
#viewer .slide{flex:0 0 100%;position:relative;overflow:hidden}
#viewer img,#viewer video{width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none}
#viewer .v-top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding:calc(var(--safe-t) + 8px) 12px;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);
  font-size:14px;transition:opacity .25s}
#viewer .v-top .close{margin-left:auto;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;font-size:18px}
#viewer .v-idx{position:absolute;top:calc(var(--safe-t) + 16px);left:0;right:0;text-align:center;color:#fff;
  font-size:13px;text-shadow:0 1px 4px rgba(0,0,0,.5);transition:opacity .25s}
/* 多选操作条 */
#selbar{position:fixed;left:12px;right:12px;bottom:calc(var(--bar-h) + var(--safe-b) + 10px);z-index:80;
  background:var(--card);border:1px solid var(--line);border-radius:16px;display:none;align-items:center;
  gap:8px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
#selbar.show{display:flex}
#selbar .count{font-weight:700;flex:1}
#selbar .sbtn{height:38px;padding:0 14px;border-radius:10px;background:var(--accent-soft);color:var(--accent);
  font-size:13px;font-weight:600;white-space:nowrap}
#selbar .sbtn.green{background:var(--green);color:#fff}
/* 底部弹层 */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:120;background:var(--card);border-radius:18px 18px 0 0;
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:70vh;display:flex;
  flex-direction:column;padding-bottom:var(--safe-b)}
#sheet.open{transform:none}
#sheet .head{padding:14px 18px 8px;font-weight:700;display:flex;align-items:center}
#sheet .head .x{margin-left:auto;color:var(--sub);font-size:18px;padding:4px 8px}
#sheet .list{overflow-y:auto;padding:4px 10px 14px}
#sheet .opt{display:flex;align-items:center;gap:12px;padding:13px 10px;border-radius:12px;font-size:15px}
#sheet .opt:active{background:var(--accent-soft)}
#sheet .opt .ic{font-size:20px}
/* 对话框 */
#dlg{position:fixed;inset:0;z-index:140;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:28px}
#dlg.open{display:flex}
#dlg .box{background:var(--card);border-radius:16px;width:100%;max-width:340px;padding:20px}
#dlg .t{font-size:16px;font-weight:700;margin-bottom:12px}
#dlg input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
  color:var(--fg);padding:0 12px;font-size:15px;outline:none}
#dlg input:focus{border-color:var(--accent)}
#dlg .btns{display:flex;gap:10px;margin-top:18px}
#dlg .btns button{flex:1;height:42px;border-radius:10px;font-size:15px;font-weight:600}
#dlg .ok{background:var(--accent);color:#fff}
#dlg .no{background:var(--bg);color:var(--fg)}
/* 设置行 */
.set-group{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.set-h{padding:14px 16px 6px;font-size:12px;color:var(--sub);font-weight:600}
.set-row{display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid var(--line)}
.set-row .tt{flex:1}
.set-row .tt .d{font-size:12px;color:var(--sub);margin-top:2px}
/* 开关 */
.switch{width:46px;height:26px;border-radius:13px;background:#d8d8d8;position:relative;flex:none;transition:background .2s}
.switch.on{background:var(--green)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
  transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.switch.on::after{transform:translateX(20px)}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--bar-h) + var(--safe-b) + 26px);transform:translateX(-50%) translateY(10px);
  background:rgba(0,0,0,.82);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;z-index:200;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 添加浮动按钮 */
#fab{position:fixed;right:18px;bottom:calc(var(--bar-h) + var(--safe-b) + 18px);z-index:60;width:56px;height:56px;
  border-radius:50%;background:var(--accent);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px rgba(46,88,232,.4)}
</style>
</head>
<body>
<header id="topbar">
  <img class="logo" src="icon-192.png" alt="">
  <h1 id="title">相册</h1>
  <button class="tb-btn" id="btn-add" aria-label="添加">＋</button>
</header>

<main>
  <section class="view active" id="view-albums">
    <div id="albums"></div>
    <div style="height:80px"></div>
  </section>
  <section class="view" id="view-photos">
    <div id="photos"></div>
    <div style="height:120px"></div>
  </section>
  <section class="view" id="view-settings"></section>
</main>

<nav id="tabbar">
  <div class="tab on" data-view="albums"><span class="ic">🖼️</span>相册</div>
  <div class="tab" data-view="photos"><span class="ic">📷</span>照片</div>
  <div class="tab" data-view="settings"><span class="ic">⚙️</span>设置</div>
</nav>

<div id="fab">＋</div>

<div id="viewer">
  <div class="v-idx" id="vIdx"></div>
  <div class="track" id="vTrack"></div>
  <div class="v-top"><span id="vName"></span><button class="close" id="vClose">✕</button></div>
</div>

<div id="selbar">
  <span class="count" id="selCount">0 项</span>
  <button class="sbtn" id="selAll">全选</button>
  <button class="sbtn green" id="selMove">移动到</button>
  <button class="sbtn" id="selDel">移除</button>
</div>

<div id="sheet">
  <div class="head">移动到相册<span class="x" id="sheetX">✕</span></div>
  <div class="list" id="sheetList"></div>
</div>

<div id="dlg">
  <div class="box">
    <div class="t" id="dlgTitle">标题</div>
    <input id="dlgInput" placeholder="请输入名称">
    <div class="btns"><button class="no" id="dlgCancel">取消</button><button class="ok" id="dlgOk">确定</button></div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* ============ 数据层（IndexedDB） ============ */
const DB_NAME = "picaphoto";
let db = null;
function openDB(){
  return new Promise((res,rej)=>{
    const rq = indexedDB.open(DB_NAME, 1);
    rq.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains("media")) d.createObjectStore("media", {keyPath:"id"});
      if(!d.objectStoreNames.contains("albums")) d.createObjectStore("albums", {keyPath:"id"});
    };
    rq.onsuccess = e => { db = e.target.result; res(db); };
    rq.onerror = () => rej(rq.error);
  });
}
function tx(store, mode){
  return db.transaction(store, mode).objectStore(store);
}
const storeGet = s => new Promise(r => { const q = tx(s).getAll(); q.onsuccess = () => r(q.result||[]); });
async function storePut(store, obj){ return new Promise(r => { tx(store,"readwrite").put(obj).onsuccess = r; }); }
async function storeDel(store, id){ return new Promise(r => { tx(store,"readwrite").delete(id).onsuccess = r; }); }

/* ============ 状态 ============ */
let media = [];        // 所有媒体
let albums = [];       // 相册
let currentView = "albums";
let currentAlbum = null;   // 当前浏览的相册 id
let selection = new Set();
let multi = false;
let theme = localStorage.getItem("pp_theme") || "auto";
let urls = new Map();      // id -> objectURL

/* ============ 工具 ============ */
const $ = s => document.querySelector(s);
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 1800);
}
function fmtSize(b){ if(b<1024) return b+" B"; if(b<1048576) return (b/1024).toFixed(1)+" KB"; return (b/1048576).toFixed(1)+" MB"; }
function isVideo(m){ return (m.type||"").startsWith("video/"); }
function objURL(m){
  if(urls.has(m.id)) return urls.get(m.id);
  const u = URL.createObjectURL(m.blob); urls.set(m.id, u); return u;
}
function applyTheme(){
  const t = theme === "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : theme;
  document.documentElement.dataset.theme = t;
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.content = t === "dark" ? "#17181c" : "#f2f3f5";
}

/* ============ 相册 ============ */
function renderAlbums(){
  const box = $("#albums");
  box.className = "alb-grid";
  box.innerHTML = "";
  const allAlb = { name:"全部照片", count:media.length, id:null };
  const cards = [allAlb, ...albums];
  cards.forEach(a => {
    const items = a.id===null ? media : media.filter(m => m.album === a.id);
    const cover = items.find(m=>!isVideo(m)) || items[0];
    const el = document.createElement("div");
    el.className = "alb";
    el.innerHTML = `<div class="cover">${cover?'<img src="'+objURL(cover)+'" alt="">':'<div style="height:100%"></div>'}</div>
      <div class="meta"><div class="name">${escapeHtml(a.name)}</div><div class="cnt">${items.length} 个</div></div>`;
    el.addEventListener("click", ()=>{ currentAlbum = a.id; openPhotosView(a.id); });
    el.addEventListener("contextmenu", e=>{ e.preventDefault(); if(a.id!==null) albumMenu(a); });
    let pt=0,long=false,th;
    el.addEventListener("touchstart", e=>{ pt=e.touches[0].clientX; long=false;
      th=setTimeout(()=>{ long=true; navigator.vibrate&&navigator.vibrate(20); if(a.id!==null) albumMenu(a); },500); },{passive:true});
    el.addEventListener("touchmove", ()=>{ clearTimeout(th); },{passive:true});
    el.addEventListener("touchend", ()=>{ clearTimeout(th); });
    el.addEventListener("click", e=>{ if(long){ e.stopPropagation(); } });
    box.appendChild(el);
  });
}
function albumMenu(a){
  sheet([{ic:"✏️",t:"重命名",f:()=>promptInput("重命名相册", a.name, async v=>{ if(v&&v!==a.name){ a.name=v; await storePut("albums",a); saveState(); } })},
          {ic:"🗑️",t:"删除相册",f:async ()=>{ if(confirm("删除相册「"+a.name+"」？相册内照片会保留在全部照片中。")){ media.forEach(m=>{ if(m.album===a.id) m.album=null; }); media.forEach(m=>storePut("media",m)); await storeDel("albums",a.id); saveState(); }}}]);
}

/* ============ 照片视图 ============ */
function openPhotosView(albumId){
  currentAlbum = albumId;
  currentView = "photos";
  switchView("photos");
  renderPhotos();
}
function visibleMedia(){ return currentAlbum===null ? media : media.filter(m=>m.album===currentAlbum); }
function renderPhotos(){
  const box = $("#photos");
  const items = visibleMedia();
  if(!items.length){ box.innerHTML = `<div class="empty"><div class="big">📷</div>还没有照片<br><span style="font-size:13px">点右下角 ＋ 从相册选择</span></div>`; return; }
  box.className = "ph-grid";
  box.innerHTML = "";
  items.forEach(m => {
    const el = document.createElement("div");
    el.className = "ph";
    el.innerHTML = `<img src="${objURL(m)}" alt=""><span class="sel">✓</span>${isVideo(m)?'<span class="dur">▶</span>':''}`;
    if(multi && selection.has(m.id)) el.classList.add("sel-on");
    if(multi) el.classList.add("multi");
    el.addEventListener("click", ()=>{ if(multi){ toggleSel(m.id, el); } else { openViewer(items, items.indexOf(m)); } });
    let th;
    el.addEventListener("touchstart", ()=>{ th=setTimeout(()=>{ if(!multi){ enterMulti(items[0]?.id); } },500); },{passive:true});
    el.addEventListener("touchmove", ()=>{ clearTimeout(th); },{passive:true});
    el.addEventListener("touchend", ()=>{ clearTimeout(th); });
    box.appendChild(el);
  });
}
function toggleSel(id, el){
  if(selection.has(id)){ selection.delete(id); el&&el.classList.remove("sel-on"); }
  else { selection.add(id); el&&el.classList.add("sel-on"); }
  updateSelbar();
}
function enterMulti(){
  multi = true; selection = new Set(); renderPhotos(); $("#selbar").classList.add("show");
  $("#title").textContent = "选择照片";
}
function exitMulti(){
  multi = false; selection = new Set(); $("#selbar").classList.remove("show");
  renderPhotos(); $("#title").textContent = currentView==="photos"?"照片":"相册";
}
function updateSelbar(){
  $("#selCount").textContent = selection.size + " 项";
}
async function moveSelected(){
  const list = visibleMedia().filter(m=>selection.has(m.id));
  if(!list.length) return;
  const opts = [{ic:"🗂️",t:"移回未整理",f:async ()=>{ list.forEach(m=>{m.album=null;}); list.forEach(m=>storePut("media",m)); saveState(); }},
    ...albums.map(a=>({ic:"📁",t:a.name,f:async ()=>{ list.forEach(m=>{m.album=a.id;}); list.forEach(m=>storePut("media",m)); saveState(); }}))];
  sheet(opts);
}
async function removeSelected(){
  const ids = [...selection];
  if(!confirm("从 PicaPhoto 中移除选中的 "+ids.length+" 项？（不会删除手机原图）")) return;
  for(const id of ids){ const m = media.find(x=>x.id===id); if(m){ urls.get(id)&&URL.revokeObjectURL(urls.get(id)); urls.delete(id); await storeDel("media",id); } }
  media = media.filter(m=>!ids.includes(m.id));
  saveState();
}

/* ============ 全屏查看器（滑动切换） ============ */
let viewerList=[], viewerIdx=0, chromeHide=false;
function openViewer(list, idx){
  viewerList = list; viewerIdx = idx; chromeHide = false;
  $("#viewer").classList.add("open");
  renderViewer();
  document.body.style.overflow="hidden";
}
function renderViewer(){
  const track = $("#vTrack"); track.innerHTML="";
  viewerList.forEach((m,i)=>{
    const s = document.createElement("div"); s.className="slide";
    if(isVideo(m)){ s.innerHTML = `<video src="${objURL(m)}" controls playsinline></video>`; }
    else { s.innerHTML = `<img src="${objURL(m)}" alt="">`; }
    s.style.transform = `translateX(${(i-viewerIdx)*100}%)`;
    track.appendChild(s);
  });
  $("#vName").textContent = viewerList[viewerIdx].name;
  $("#vIdx").textContent = (viewerIdx+1) + " / " + viewerList.length;
}
function moveViewer(step){
  viewerIdx = Math.max(0, Math.min(viewerList.length-1, viewerIdx+step));
  renderViewer();
}
$("#vClose").addEventListener("click", ()=>{ $("#viewer").classList.remove("open"); document.body.style.overflow=""; });
$("#viewer").addEventListener("click", e=>{
  if(e.target.closest("video") || e.target.closest(".v-top")) return;
  chromeHide = !chromeHide;
  document.querySelectorAll("#viewer .v-top,#viewer .v-idx").forEach(x=>x.style.opacity = chromeHide?0:1);
});
let tsx=0;
$("#viewer").addEventListener("touchstart", e=>{ tsx=e.touches[0].clientX; },{passive:true});
$("#viewer").addEventListener("touchend", e=>{
  const dx = e.changedTouches[0].clientX - tsx;
  if(Math.abs(dx) > 60) moveViewer(dx<0 ? 1 : -1);
},{passive:true});

/* ============ 底部弹层 ============ */
function sheet(opts){
  const list = $("#sheetList"); list.innerHTML="";
  opts.forEach(o=>{
    const el = document.createElement("div"); el.className="opt";
    el.innerHTML = `<span class="ic">${o.ic}</span>${o.t}`;
    el.addEventListener("click", ()=>{ closeSheet(); o.f(); });
    list.appendChild(el);
  });
  $("#sheet").classList.add("open");
}
function closeSheet(){ $("#sheet").classList.remove("open"); }
$("#sheetX").addEventListener("click", closeSheet);
$("#sheet").addEventListener("click", e=>{ if(e.target===$("#sheet")) closeSheet(); });

/* ============ 对话框 ============ */
function promptInput(title, value, onOk){
  $("#dlgTitle").textContent = title;
  const inp = $("#dlgInput"); inp.value = value||""; inp.focus();
  $("#dlg").classList.add("open");
  const ok = $("#dlgOk"), cancel = $("#dlgCancel");
  ok.onclick = async ()=>{ const v=inp.value.trim(); if(!v){ toast("名称不能为空"); return; } $("#dlg").classList.remove("open"); await onOk(v); };
  cancel.onclick = ()=>{ $("#dlg").classList.remove("open"); };
  inp.onkeydown = e=>{ if(e.key==="Enter") ok.click(); };
}

/* ============ 添加媒体（手机相册多选） ============ */
const fileInput = document.createElement("input");
fileInput.type = "file"; fileInput.multiple = true;
fileInput.accept = "image/*,video/*";
fileInput.style.display = "none"; document.body.appendChild(fileInput);
async function addFiles(files){
  const arr = [...files];
  for(const f of arr){
    const m = { id:uid(), name:f.name, type:f.type, size:f.size, addedAt:Date.now(), album:currentView==="photos"?currentAlbum:null, blob:f };
    media.push(m); await storePut("media", m);
  }
  saveState(); toast("已添加 "+arr.length+" 项");
}
$("#btn-add").addEventListener("click", ()=>{ fileInput.click(); });
$("#fab").addEventListener("click", ()=>{ fileInput.click(); });
fileInput.addEventListener("change", ()=>{ if(fileInput.files.length) addFiles(fileInput.files); fileInput.value=""; });

/* ============ 设置 ============ */
function renderSettings(){
  const s = $("#view-settings");
  const darkOn = theme==="dark" || (theme==="auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  s.innerHTML = `
    <div class="set-h">外观</div>
    <div class="set-group">
      <div class="set-row"><div class="tt">深色模式<div class="d">跟随系统 / 手动切换</div></div>
        <div class="switch ${darkOn?'on':''}" id="swDark"></div></div>
      <div class="set-row" id="rowTheme"><div class="tt">主题<div class="d" id="themeDesc">${theme==="auto"?"跟随系统":theme==="dark"?"深色":"浅色"}</div></div></div>
    </div>
    <div class="set-h">数据</div>
    <div class="set-group">
      <div class="set-row"><div class="tt">照片与视频<div class="d">共 ${media.length} 项</div></div></div>
      <div class="set-row" id="rowClean"><div class="tt">清理全部数据<div class="d">删除 PicaPhoto 内所有照片与相册</div></div></div>
    </div>
    <div class="set-h">关于</div>
    <div class="set-group">
      <div class="set-row"><div class="tt">PicaPhoto 移动版<div class="d">v1.0 · 适配高刷与高分屏 · 微信/飞书风格</div></div></div>
    </div>`;
  $("#swDark").addEventListener("click", e=>{
    const sw = e.currentTarget;
    const next = sw.classList.contains("on") ? "light" : "dark";
    theme = next; localStorage.setItem("pp_theme", theme); applyTheme(); renderSettings();
  });
  $("#rowTheme").addEventListener("click", ()=>{
    sheet([{ic:"🌗",t:"跟随系统",f:()=>{ theme="auto"; localStorage.setItem("pp_theme","auto"); applyTheme(); renderSettings(); }},
           {ic:"☀️",t:"浅色",f:()=>{ theme="light"; localStorage.setItem("pp_theme","light"); applyTheme(); renderSettings(); }},
           {ic:"🌙",t:"深色",f:()=>{ theme="dark"; localStorage.setItem("pp_theme","dark"); applyTheme(); renderSettings(); }}]);
  });
  $("#rowClean").addEventListener("click", async ()=>{
    if(!confirm("确定清空 PicaPhoto 内全部数据？")) return;
    await new Promise(r=>{ const q=tx("media","readwrite").clear(); q.onsuccess=r; });
    await new Promise(r=>{ const q=tx("albums","readwrite").clear(); q.onsuccess=r; });
    media=[]; albums=[]; urls.forEach(u=>URL.revokeObjectURL(u)); urls.clear(); saveState();
  });
}

/* ============ 视图切换 ============ */
function switchView(name){
  currentView = name;
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $("#view-"+name).classList.add("active");
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on", t.dataset.view===name));
  $("#title").textContent = name==="albums"?"相册":name==="photos"?"照片":"设置";
  exitMulti();
  if(name==="albums"){ currentAlbum=null; renderAlbums(); }
  if(name==="photos"){ renderPhotos(); }
  if(name==="settings"){ renderSettings(); }
}
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click", ()=>{ switchView(t.dataset.view); });
});
$("#selAll").addEventListener("click", ()=>{ visibleMedia().forEach(m=>selection.add(m.id)); renderPhotos(); updateSelbar(); });
$("#selMove").addEventListener("click", moveSelected);
$("#selDel").addEventListener("click", removeSelected);

/* ============ 启动 ============ */
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function saveState(){ renderAlbums(); if(currentView==="photos") renderPhotos(); if(currentView==="settings") renderSettings(); }
async function init(){
  try{ await openDB(); }catch(e){ toast("浏览器不支持，请用较新浏览器"); }
  media = await storeGet("media");
  albums = await storeGet("albums");
  applyTheme();
  renderAlbums();
  renderSettings();
  if(navigator.serviceWorker){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
  window.addEventListener("online", ()=>toast("已联网"));
}
init();
</script>
