<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2e58e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PicaPhoto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f2f3f5; --card:#fff; --fg:#1f2329; --sub:#8a919f; --line:#e4e6eb;
  --accent:#2e58e8; --accent-soft:#eef3ff; --green:#07c160; --danger:#e54545;
  --bar-h:54px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --r:14px; color-scheme:light dark;
}
[data-theme="dark"]{
  --bg:#17181c; --card:#262931; --fg:#f2f4f8; --sub:#9aa3b2; --line:#333844;
  --accent:#4d8dff; --accent-soft:#1f2c47; --green:#2fd08a; --danger:#ff6b6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{overflow:hidden;touch-action:manipulation}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
#topbar{position:fixed;top:0;left:0;right:0;z-index:50;height:calc(var(--bar-h) + var(--safe-t));
  padding:var(--safe-t) 14px 0;display:flex;align-items:center;gap:10px;
  background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
#topbar .logo{width:30px;height:30px;border-radius:8px;flex:none}
#topbar h1{font-size:17px;font-weight:700;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tb-btn{min-width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:17px;background:var(--card);border:1px solid var(--line);padding:0 8px}
main{position:fixed;inset:calc(var(--bar-h) + var(--safe-t)) 0 calc(var(--bar-h) + var(--safe-b));overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 30px;display:none}
.view.active{display:block}
.set-h{font-size:12px;color:var(--sub);font-weight:600;padding:8px 4px 4px}
.full{grid-column:1/-1}
.alb-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.alb{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:transform .12s}
.alb:active{transform:scale(.97)}
.alb .cover{width:100%;aspect-ratio:4/3;background:var(--accent-soft);position:relative}
.alb .cover img{width:100%;height:100%;object-fit:cover;display:block}
.alb .meta{padding:10px 12px}
.alb .name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alb .cnt{font-size:12px;color:var(--sub);margin-top:2px}
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.ph{aspect-ratio:1;background:var(--card);border-radius:6px;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ph .sel{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;
  background:var(--accent);color:#fff;display:none;align-items:center;justify-content:center;font-size:13px}
.ph.multi .sel{display:flex}
.ph.sel-on{outline:3px solid var(--accent);outline-offset:-3px}
.ph .dur{position:absolute;right:4px;bottom:4px;font-size:10px;color:#fff;background:rgba(0,0,0,.55);
  padding:1px 5px;border-radius:6px}
.empty{padding:56px 24px;text-align:center;color:var(--sub)}
.empty .big{font-size:54px;margin-bottom:12px}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--bar-h) + var(--safe-b));
  padding-bottom:var(--safe-b);display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11px;color:var(--sub)}
.tab .ic{font-size:21px;line-height:1;position:relative}
.tab .ic .bdg{position:absolute;top:-6px;right:-10px;min-width:16px;height:16px;border-radius:8px;
  background:var(--danger);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tab.on{color:var(--accent);font-weight:600}
.big-btn{margin:12px auto 0;height:50px;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;width:min(320px,80%)}
.big-btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.big-btn.danger{background:var(--danger)}
.trash-actions{position:sticky;bottom:0;display:flex;gap:10px;padding:10px 0 calc(var(--safe-b) + 8px);
  background:linear-gradient(transparent,var(--bg) 30%)}
.tool-card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:14px 16px;margin-bottom:14px;transition:transform .12s}
.tool-card:active{transform:scale(.98)}
.tool-card .ic{width:42px;height:42px;border-radius:12px;background:var(--danger);color:#fff;font-size:20px;
  display:flex;align-items:center;justify-content:center;flex:none}
.tool-card .tt{flex:1}
.tool-card .tt .n{font-size:15px;font-weight:600}
.tool-card .tt .d{font-size:12px;color:var(--sub);margin-top:2px}
.tool-card .arrow{color:var(--sub);font-size:16px}
/* ============ 我的（统计 / 日历 / 设置） ============ */
.me-head{display:flex;align-items:center;gap:14px;padding:6px 4px 16px}
.me-head img{width:56px;height:56px;border-radius:14px;flex:none;box-shadow:0 6px 16px rgba(46,88,232,.25)}
.me-head .me-name{font-size:20px;font-weight:800}
.me-head .me-ver{font-size:12px;color:var(--sub);margin-top:3px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px;
  display:flex;flex-direction:column;align-items:center;gap:4px}
.stat b{font-size:20px;font-weight:800;color:var(--accent)}
.stat span{font-size:11px;color:var(--sub)}
.cal-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head button{width:30px;height:30px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:15px}
.cal-head b{font-size:15px}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10px;color:var(--sub);margin-bottom:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:12px;color:var(--fg);background:var(--bg);position:relative}
.cal-day b{font-size:10px;color:#fff;font-weight:700}
.cal-day.lvl1{background:color-mix(in srgb,var(--accent) 28%,var(--card))}
.cal-day.lvl2{background:color-mix(in srgb,var(--accent) 55%,var(--card))}
.cal-day.lvl3{background:var(--accent)}
.cal-day.lvl2,.cal-day.lvl3{color:#fff}
.cal-day.muted{opacity:.35}
.cal-legend{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:10px;font-size:10px;color:var(--sub)}
.cal-legend span{width:14px;height:14px;border-radius:4px;display:inline-block;background:var(--bg)}
.cal-legend .l1{background:color-mix(in srgb,var(--accent) 28%,var(--card))}
.cal-legend .l2{background:color-mix(in srgb,var(--accent) 55%,var(--card))}
.cal-legend .l3{background:var(--accent)}

/* ============ 全屏查看器（窗口化 + 预加载，Phoom 手势） ============ */
#viewer{position:fixed;inset:0;background:#000;z-index:100;display:none;touch-action:none;overflow:hidden}
#viewer.open{display:block}
#vTrack{position:absolute;inset:0;will-change:transform;transform:translate(0,0)}
#viewer .slide{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
  transform:translateX(0);transition:none;will-change:transform}
#viewer .slide.peek{transform:translateX(0) scale(1.05)}
#viewer .slide.zoomed img{transform:scale(2.2);transition:transform .25s ease}
#viewer img,#viewer video{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;
  pointer-events:none;user-select:none;-webkit-user-drag:none;content-visibility:auto}
#viewer video{pointer-events:auto}
.v-top{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:10px;
  padding:calc(var(--safe-t) + 10px) 14px 10px;color:#fff;
  background:linear-gradient(rgba(0,0,0,.55),transparent);opacity:1;transition:opacity .25s}
.v-top.hidden{opacity:0;pointer-events:none}
.v-top .v-count{flex:1;font-size:14px;font-weight:600}
.v-top .v-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:16px;
  display:flex;align-items:center;justify-content:center}
.v-bottom{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;justify-content:space-around;
  gap:10px;padding:14px 24px calc(var(--safe-b) + 14px);color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.55));opacity:1;transition:opacity .25s}
.v-bottom.hidden{opacity:0;pointer-events:none}
.v-bottom .v-btn{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:22px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:transform .12s}
.v-bottom .v-btn:active{transform:scale(.92)}
.v-bottom .v-btn span{font-size:10px;font-weight:400}
.v-bottom .v-btn.on{background:var(--accent)}
.v-bottom .v-btn.danger{background:var(--danger)}
#vHint{position:absolute;top:calc(var(--safe-t) + 60px);left:50%;transform:translateX(-50%);z-index:7;
  color:#fff;font-size:13px;background:rgba(0,0,0,.45);padding:6px 14px;border-radius:16px;opacity:0;
  transition:opacity .2s;white-space:nowrap}
#vHint.show{opacity:1}
#vTrashZone{position:absolute;top:0;left:0;right:0;z-index:8;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:calc(var(--safe-t) + 12px) 0;background:rgba(229,69,69,.94);color:#fff;font-size:14px;font-weight:600;
  transform:translateY(-100%);transition:transform .2s}
#vTrashZone.show{transform:translateY(0)}
#vTrashZone .ic{font-size:28px}

/* ============ 多选栏 ============ */
#selbar{position:fixed;left:0;right:0;bottom:0;z-index:80;display:flex;align-items:center;gap:10px;
  padding:10px 14px calc(var(--safe-b) + 10px);background:color-mix(in srgb,var(--card) 94%,transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);transform:translateY(120%);transition:transform .25s}
#selbar.show{transform:translateY(0)}
#selbar .count{flex:1;font-size:14px;font-weight:600;white-space:nowrap}
#selbar .sbtn{height:40px;padding:0 16px;border-radius:20px;background:var(--bg);border:1px solid var(--line);font-size:14px}
#selbar .sbtn.green{background:var(--accent);color:#fff;border:none}
#selbar .sbtn.danger{background:var(--danger);color:#fff;border:none}

/* ============ 底部弹层 / 对话框 ============ */
#sheet{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.4);display:none;align-items:flex-end}
#sheet.open{display:flex}
#sheet .panel{width:100%;background:var(--card);border-radius:18px 18px 0 0;padding:10px 0 calc(var(--safe-b) + 14px);
  animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
#sheet .head{display:flex;align-items:center;padding:12px 18px 6px;font-size:13px;color:var(--sub);font-weight:600}
#sheet .head .x{margin-left:auto;font-size:18px;color:var(--sub);padding:4px}
#sheet .opt{display:flex;align-items:center;gap:14px;padding:14px 20px;font-size:16px;border-top:1px solid var(--line)}
#sheet .opt .ic{font-size:20px;width:24px;text-align:center}
#dlg,#updateDlg{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center}
#dlg.open,#updateDlg.open{display:flex}
#dlg .box,#updateDlg .box{width:min(340px,86%);background:var(--card);border-radius:16px;padding:20px}
#dlg .t,#updateDlg .t{font-size:16px;font-weight:700;margin-bottom:12px;text-align:center}
#dlg input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
  color:var(--fg);padding:0 12px;font-size:15px;outline:none}
#dlg input:focus{border-color:var(--accent)}
#dlg .btns,#updateDlg .btns{display:flex;gap:10px;margin-top:18px}
#dlg .btns button,#updateDlg .btns button{flex:1;height:42px;border-radius:10px;font-size:15px;font-weight:600}
#dlg .ok,#updateDlg .ok{background:var(--accent);color:#fff}
#dlg .no,#updateDlg .no{background:var(--bg);color:var(--fg)}
#updateDlg .ver{font-size:13px;color:var(--accent);font-weight:700;text-align:center;margin-bottom:8px}
#updateDlg .log{max-height:160px;overflow-y:auto;background:var(--bg);border-radius:10px;padding:10px 12px;
  font-size:12px;line-height:1.6;color:var(--sub);white-space:pre-wrap;word-break:break-word}

/* ============ 设置 ============ */
.set-group{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.set-h2{padding:14px 16px 6px;font-size:12px;color:var(--sub);font-weight:600}
.set-row{display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid var(--line)}
.set-row .tt{flex:1}
.set-row .tt .d{font-size:12px;color:var(--sub);margin-top:2px}
.set-row .arrow{color:var(--sub);font-size:15px}
.switch{width:46px;height:26px;border-radius:13px;background:#d8d8d8;position:relative;flex:none;transition:background .2s}
.switch.on{background:var(--green)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
  transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.switch.on::after{transform:translateX(20px)}

/* ============ Toast ============ */
#toast{position:fixed;left:50%;bottom:calc(var(--bar-h) + var(--safe-b) + 26px);transform:translateX(-50%) translateY(10px);
  background:rgba(0,0,0,.82);color:#fff;padding:10px 16px;border-radius:22px;font-size:14px;z-index:200;
  display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  max-width:88%}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast .act{color:#7ab8ff;font-weight:700;font-size:14px;padding:4px}

/* ============ FAB ============ */
#fab{position:fixed;right:18px;bottom:calc(var(--bar-h) + var(--safe-b) + 18px);z-index:60;width:56px;height:56px;
  border-radius:50%;background:var(--accent);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px rgba(46,88,232,.4)}
</style>
</head>
<body>
<header id="topbar">
  <img class="logo" src="icon-192.png" alt="">
  <h1 id="title">整理</h1>
  <button class="tb-btn" id="btn-add" aria-label="添加">＋</button>
</header>

<main>
  <section class="view active" id="view-home">
    <div class="tool-card" id="trashCard">
      <div class="ic">🗑️</div>
      <div class="tt"><div class="n">回收站</div><div class="d" id="trashCardD">上滑照片即可回收，误删可找回</div></div>
      <span class="arrow">›</span>
    </div>
    <div id="albums"></div>
    <div style="height:80px"></div>
  </section>
  <section class="view" id="view-photos"><div id="photos"></div><div style="height:120px"></div></section>
  <section class="view" id="view-trash"><div id="trash"></div></section>
  <section class="view" id="view-me"></section>
</main>

<nav id="tabbar">
  <div class="tab on" data-tab="org"><span class="ic">🗂️</span>整理</div>
  <div class="tab" data-tab="me"><span class="ic">👤</span>我的</div>
</nav>

<div id="fab">＋</div>

<!-- 全屏查看器：左右滑动切换 / 上滑回收 / 下滑返回 / 点按工具栏 / 长按 Peek -->
<div id="viewer">
  <div id="vTrack"></div>
  <div id="vTrashZone"><span class="ic">🗑️</span><span>松手移入回收站</span></div>
  <div id="vHint">↑ 上滑回收 · ↓ 下滑返回</div>
  <div class="v-top hidden" id="vTop">
    <span class="v-count" id="vCount">1 / 1</span>
    <button class="v-btn" id="vClose">✕</button>
  </div>
  <div class="v-bottom hidden" id="vBottom"></div>
</div>

<div id="selbar">
  <span class="count" id="selCount">0 项</span>
  <button class="sbtn" id="selAll">全选</button>
  <button class="sbtn green" id="selMove">移动到</button>
  <button class="sbtn danger" id="selDel">删除</button>
</div>

<div id="sheet">
  <div class="panel">
    <div class="head"><span id="sheetTitle">选择操作</span><span class="x" id="sheetX">✕</span></div>
    <div class="list" id="sheetList"></div>
  </div>
</div>

<div id="dlg">
  <div class="box">
    <div class="t" id="dlgTitle">标题</div>
    <input id="dlgInput" placeholder="请输入名称">
    <div class="btns"><button class="no" id="dlgCancel">取消</button><button class="ok" id="dlgOk">确定</button></div>
  </div>
</div>

<div id="updateDlg">
  <div class="box">
    <div class="t">发现新版本</div>
    <div class="ver" id="updVer"></div>
    <div class="log" id="updLog"></div>
    <div class="btns"><button class="no" id="updLater">稍后</button><button class="ok" id="updNow">立即更新</button></div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* ============ 原生桥接 ============ */
const BRIDGE = (typeof window !== "undefined" && window.Android) || null;
const APP_VERSION = "1.0.3";
const GITHUB_API = "https://api.github.com/repos/Yan16384/PicaPhoto/releases/latest";
let phoneAlbums = [];
let phoneAlbum = null;      // 当前浏览的手机相册 id
let phoneMedia = [];        // 当前手机相册媒体

/* ============ 数据层（IndexedDB v3：media / albums / trash / stats） ============ */
const DB_NAME = "picaphoto";
let db = null;
function openDB(){
  return new Promise((res,rej)=>{
    const rq = indexedDB.open(DB_NAME, 3);
    rq.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains("media")) d.createObjectStore("media", {keyPath:"id"});
      if(!d.objectStoreNames.contains("albums")) d.createObjectStore("albums", {keyPath:"id"});
      if(!d.objectStoreNames.contains("trash")) d.createObjectStore("trash", {keyPath:"id"});
      if(!d.objectStoreNames.contains("stats")) d.createObjectStore("stats", {keyPath:"key"});
    };
    rq.onsuccess = e => { db = e.target.result; res(db); };
    rq.onerror = () => rej(rq.error);
  });
}
function tx(store, mode){ return db.transaction(store, mode).objectStore(store); }
const storeGet = s => new Promise(r => { const q = tx(s).getAll(); q.onsuccess = () => r(q.result||[]); });
async function storePut(store, obj){ return new Promise(r => { tx(store,"readwrite").put(obj).onsuccess = r; }); }
async function storeDel(store, id){ return new Promise(r => { tx(store,"readwrite").delete(id).onsuccess = r; }); }

/* ============ 状态 ============ */
let media = [];
let albums = [];
let appTrash = [];
let phoneTrash = [];
let trashList = [];
let tab = "org";            // org | me
let orgSub = "home";        // home | photos | trash
let currentAlbum = null;
let selection = new Set();
let multi = false;
let theme = localStorage.getItem("pp_theme") || "auto";
let urls = new Map();
let lastTrashed = null;
let favs = new Set(JSON.parse(localStorage.getItem("pp_favs")||"[]"));
let stats = { organizedTotal:0, organizedByDay:{}, trashTotal:0, restoreTotal:0, startDate:null };
let calYear, calMonth;

const $ = s => document.querySelector(s);
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function toast(msg, act, fn){
  const t=$("#toast");
  t.innerHTML = "<span>"+escapeHtml(msg)+"</span>" + (fn ? '<button class="act" id="toastAct">'+escapeHtml(act)+"</button>" : "");
  t.classList.add("show"); clearTimeout(t._h);
  const a=$("#toastAct");
  if(a){ a.onclick=()=>{ t.classList.remove("show"); fn(); }; }
  t._h=setTimeout(()=>t.classList.remove("show"),2600);
}
function isVideo(m){ return (m.type||m.mime||"").startsWith("video/"); }
function itemKey(m){ return m.uri || m.id; }
function objURL(m){
  if(m.uri) return m.uri;
  if(urls.has(m.id)) return urls.get(m.id);
  if(!m.blob) return "";
  const u=URL.createObjectURL(m.blob); urls.set(m.id,u); return u;
}
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function isFav(m){ return m.uri ? favs.has(m.uri) : favs.has(m.id); }
function toggleFav(m){
  const k = m.uri || m.id;
  if(favs.has(k)) favs.delete(k); else favs.add(k);
  localStorage.setItem("pp_favs", JSON.stringify([...favs]));
  updateViewerChrome();
}
function vibrate(ms){ try{ navigator.vibrate && navigator.vibrate(ms||15); }catch(e){} }

/* ============ 主题：跟随系统（APK 用原生 isSystemDark，网页用媒体查询） ============ */
function systemDark(){
  if(BRIDGE && BRIDGE.isSystemDark){
    try{ return !!BRIDGE.isSystemDark(); }catch(e){}
  }
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
function applyTheme(){
  const t = theme==="auto" ? (systemDark()?"dark":"light") : theme;
  document.documentElement.dataset.theme = t;
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.content = t === "dark" ? "#17181c" : "#f2f3f5";
  if(tab==="me") renderMe();
}
window.__sysDarkChanged = ()=>{ if(theme==="auto"){ applyTheme(); } };
if(matchMedia && matchMedia("(prefers-color-scheme: dark)").addEventListener){
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>{ if(theme==="auto") applyTheme(); });
}

/* ============ 整理统计（独立存储，永不因删照片/清理而清空） ============ */
function todayKey(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
async function loadStats(){
  const arr = await storeGet("stats");
  stats = arr[0] || { key:"main", organizedTotal:0, organizedByDay:{}, trashTotal:0, restoreTotal:0, startDate:null };
  stats.key = "main";
}
async function saveStats(){ await storePut("stats", stats); }
async function recordStats(type, n){
  const k = todayKey();
  if(type==="move"){ stats.organizedTotal += n; stats.organizedByDay[k] = (stats.organizedByDay[k]||0) + n; if(!stats.startDate) stats.startDate = k; }
  else if(type==="trash"){ stats.trashTotal += n; }
  else if(type==="restore"){ stats.restoreTotal += n; }
  await saveStats();
}
function storageBytes(){
  let s=0;
  for(const m of media){ if(m.blob && m.blob.size) s += m.blob.size; }
  for(const t of appTrash){ if(t.blob && t.blob.size) s += t.blob.size; }
  return s;
}
function fmtBytes(n){
  if(n < 1024*1024) return (n/1024).toFixed(0) + " KB";
  return (n/1024/1024).toFixed(1) + " MB";
}

/* ============ 手机相册（原生桥接） ============ */
function refreshPhoneAlbums(){
  if(!BRIDGE) return;
  try { phoneAlbums = BRIDGE.hasPermission() ? JSON.parse(BRIDGE.readAlbums()) : []; } catch(e){ phoneAlbums=[]; }
}

  exitMulti();
  try { phoneMedia = JSON.parse(BRIDGE.readMedia(id)); } catch(e){ phoneMedia=[]; }

}
/* ============ 整理首页：相册 + 手机相册 ============ */
function renderHome(){
  const box = $("#albums");
  box.className = "alb-grid";
  box.innerHTML = "";
  box.appendChild(document.createElement("div")).className = "set-h full";
  box.lastChild.textContent = "我的相册";
  const allAlb = { name:"全部照片", count:media.length, id:null };
  [allAlb, ...albums].forEach(a => {
    const items = a.id===null ? media : media.filter(m => m.album === a.id);
    const cover = items.find(m=>!isVideo(m)) || items[0];
    const el = document.createElement("div");
    el.className = "alb";
    el.innerHTML = `<div class="cover">${cover?'<img loading="lazy" decoding="async" src="'+objURL(cover)+'" alt="">':'<div style="height:100%"></div>'}</div>
      <div class="meta"><div class="name">${escapeHtml(a.name)}</div><div class="cnt">${items.length} 个</div></div>`;
    el.addEventListener("click", ()=>{ currentAlbum = a.id; openPhotosView(a.id); });
    let th;
    el.addEventListener("touchstart", ()=>{ th=setTimeout(()=>{ vibrate(15); if(a.id!==null) albumMenu(a); },500); },{passive:true});
    el.addEventListener("touchmove", ()=>{ clearTimeout(th); },{passive:true});
    el.addEventListener("touchend", ()=>{ clearTimeout(th); });
    box.appendChild(el);
  });

  if(BRIDGE){
    box.appendChild(document.createElement("div")).className = "set-h full";
    box.lastChild.textContent = "手机相册";
    if(!BRIDGE.hasPermission()){
      const p = document.createElement("div");
      p.className = "full empty";
      p.innerHTML = `<div class="big">🖼️</div>需要权限才能读取手机相册<br><button class="big-btn" id="btnPerm">授权读取相册</button>`;
      box.appendChild(p);
      p.querySelector("#btnPerm").addEventListener("click", requestPhonePermission);
    } else {
      phoneAlbums.forEach(a => {
        const el = document.createElement("div");
        el.className = "alb";
        el.innerHTML = `<div class="cover">${a.cover?'<img loading="lazy" decoding="async" src="'+a.cover+'" alt="">':'<div style="height:100%"></div>'}</div>
          <div class="meta"><div class="name">${escapeHtml(a.name)}</div><div class="cnt">${a.count} 个</div></div>`;
        el.addEventListener("click", ()=>{ openPhoneAlbum(a.id, a.name); });
        box.appendChild(el);
      });
      if(!phoneAlbums.length){
        const p = document.createElement("div");
        p.className = "full empty";
        p.innerHTML = `<div class="big">📭</div>手机相册为空`;
        box.appendChild(p);
      }
    }
  }
}
function albumMenu(a){
  sheet([{ic:"✏️",t:"重命名",f:()=>promptInput("重命名相册", a.name, async v=>{ if(v&&v!==a.name){ a.name=v; await storePut("albums",a); saveState(); } })},
          {ic:"🗑️",t:"删除相册",f:async ()=>{ if(confirm("删除相册「"+a.name+"」？照片会保留在全部照片中。")){ media.forEach(m=>{ if(m.album===a.id) m.album=null; }); media.forEach(m=>storePut("media",m)); await storeDel("albums",a.id); saveState(); }}}]);
}
function openPhotosView(albumId){ currentAlbum=albumId; orgSub="photos"; exitMulti(); showOrg(); }
function visibleMedia(){ return phoneAlbum!==null ? phoneMedia : (currentAlbum===null?media:media.filter(m=>m.album===currentAlbum)); }

/* ============ 照片网格（懒加载加速） ============ */
function renderPhotos(){
  const box = $("#photos");
  const items = visibleMedia();
  if(!items.length){
    box.innerHTML = `<div class="empty"><div class="big">📷</div>还没有照片<br><span style="font-size:13px">点右上角 ＋ 从手机相册选择</span></div>`;
    return;
  }
  box.className = "ph-grid";
  box.innerHTML = "";
  items.forEach(m => {
    const key = itemKey(m);
    const el = document.createElement("div");
    el.className = "ph";
    el.innerHTML = `<img loading="lazy" decoding="async" src="${objURL(m)}" alt=""><span class="sel">✓</span>${isVideo(m)?'<span class="dur">▶</span>':''}`;
    if(multi && selection.has(key)) el.classList.add("sel-on");
    if(multi) el.classList.add("multi");
    el.addEventListener("click", ()=>{ if(multi){ toggleSel(key, el); } else { openViewer(items, items.indexOf(m), "normal"); } });
    let th;
    el.addEventListener("touchstart", ()=>{ th=setTimeout(()=>{ if(!multi){ vibrate(15); enterMulti(); } },500); },{passive:true});
    el.addEventListener("touchmove", ()=>{ clearTimeout(th); },{passive:true});
    el.addEventListener("touchend", ()=>{ clearTimeout(th); });
    box.appendChild(el);
  });
}
function toggleSel(key, el){
  if(selection.has(key)){ selection.delete(key); el&&el.classList.remove("sel-on"); }
  else { selection.add(key); el&&el.classList.add("sel-on"); }
  updateSelbar();
}
function enterMulti(){
  multi = true; selection = new Set(); renderPhotos();
  $("#selbar").classList.add("show");
  $("#selDel").style.display = phoneAlbum!==null ? "none" : "";
  $("#title").textContent = "选择照片";
}
function exitMulti(){
  multi = false; selection = new Set();
  $("#selbar").classList.remove("show");
  renderPhotos();
  if(orgSub==="photos") updateTitle();
}
function updateSelbar(){ $("#selCount").textContent = selection.size + " 项"; }
function updateTitle(){
  if(tab==="me"){ $("#title").textContent="我的"; return; }
  if(orgSub==="home"){ $("#title").textContent="整理"; return; }
  if(orgSub==="trash"){ $("#title").textContent="回收站"; return; }
  $("#title").textContent = phoneAlbum!==null ? "手机相册" : (currentAlbum===null ? "全部照片" : ((albums.find(a=>a.id===currentAlbum)||{}).name||"照片"));
}

/* 移动选中（记录整理统计） */
function moveSelected(){
  const list = visibleMedia().filter(m=>selection.has(itemKey(m)));
  if(!list.length) return;
  if(phoneAlbum!==null){
    const opts = albums.map(a=>({ic:"📁",t:a.name,f:()=>nativeMove(a.name,list)}));
    opts.push({ic:"➕",t:"新建相册…",f:()=>promptInput("新建相册","",async v=>{ if(v){ nativeMove(v,list); } })});
    sheet(opts,"移动到相册");
    return;
  }
  const opts = [{ic:"🗂️",t:"移回未整理",f:async ()=>{ list.forEach(m=>{m.album=null;}); list.forEach(m=>storePut("media",m)); recordStats("move",list.length); toast("已移回未整理"); saveState(); }},
    ...albums.map(a=>({ic:"📁",t:a.name,f:async ()=>{ list.forEach(m=>{m.album=a.id;}); list.forEach(m=>storePut("media",m)); recordStats("move",list.length); toast("已移动到「"+a.name+"」"); saveState(); }}))];
  sheet(opts,"移动到相册");
}
function nativeMove(name, list){
  try {
    const uris = JSON.stringify(list.map(m=>m.uri));
    const res = JSON.parse(BRIDGE.moveToAlbum(name, uris));
    const ok = res.filter(r=>r.ok).length;
    recordStats("move", ok);
    toast(`已移动 ${ok} 项到「${name}」` + (ok<res.length?`，${res.length-ok} 项无权限跳过`:""));
  } catch(e){ toast("移动失败："+e); }
  exitPhoneMode();
}
async function removeSelected(){
  if(phoneAlbum!==null) return;
  const ids = [...selection].filter(k => k && !k.startsWith("content:"));
  if(!ids.length) return;
  if(!confirm("从 PicaPhoto 中删除选中的 "+ids.length+" 项？（可稍后在回收站找回）")) return;
  for(const k of ids){ const m = media.find(x=>x.id===k); if(m){ await trashOne(m); } }
  exitMulti();
  saveState();
}
/* ============ 回收站 ============ */
async function refreshTrash(){
  appTrash = await storeGet("trash");
  if(BRIDGE && BRIDGE.hasPermission()){
    try{ phoneTrash = JSON.parse(BRIDGE.readTrash()); }catch(e){ phoneTrash=[]; }
  } else phoneTrash = [];
  trashList = [
    ...appTrash.map(t=>({id:t.id, name:t.name, mime:t.mime, isVideo:t.isVideo, trashedAt:t.trashedAt, blob:t.blob, fromApp:true})),
    ...phoneTrash.map(t=>({id:"p_"+t.uri, name:t.name, mime:t.mime, isVideo:t.isVideo, uri:t.uri, trashedAt:(t.dateAdded||0)*1000, fromPhone:true}))
  ];
  const d=$("#trashCardD");
  if(d) d.textContent = trashList.length ? ("共 "+trashList.length+" 项 · 上滑照片即可回收") : "上滑照片即可回收，误删可找回";
}
function renderTrash(){
  const box=$("#trash");
  box.className="ph-grid";
  box.innerHTML="";
  if(!trashList.length){
    box.innerHTML=`<div class="empty full"><div class="big">🗑️</div>回收站是空的<br><span style="font-size:13px">查看照片时上滑即可移入回收站</span></div>`;
    return;
  }
  trashList.forEach(m=>{
    const el=document.createElement("div"); el.className="ph";
    el.innerHTML=`<img loading="lazy" decoding="async" src="${objURL(m)}" alt="">${m.isVideo?'<span class="dur">▶</span>':''}`;
    el.addEventListener("click", ()=>{ openViewer(trashList, trashList.indexOf(m), "trash"); });
    let th;
    el.addEventListener("touchstart", ()=>{ th=setTimeout(()=>{ vibrate(15); sheetTrashItem(m); },500); },{passive:true});
    el.addEventListener("touchmove", ()=>{ clearTimeout(th); },{passive:true});
    el.addEventListener("touchend", ()=>{ clearTimeout(th); });
    box.appendChild(el);
  });
  const actions=document.createElement("div");
  actions.className="trash-actions full";
  actions.innerHTML=`<button class="big-btn ghost" id="btnRestoreAll">↩️ 全部恢复</button>
    <button class="big-btn danger" id="btnEmpty">清空回收站</button>`;
  box.appendChild(actions);
  $("#btnRestoreAll").addEventListener("click", restoreAllTrash);
  $("#btnEmpty").addEventListener("click", emptyTrash);
}
function sheetTrashItem(m){
  sheet([{ic:"↩️",t:"恢复",f:()=>restoreFromTrash(m)},
          {ic:"🗑️",t:"彻底删除",f:()=>permanentDelete(m)}],"回收站操作");
}
async function restoreFromTrash(m){
  if(m.fromPhone){
    try{
      const res=JSON.parse(BRIDGE.restoreTrash(JSON.stringify([m.uri])));
      if(res[0]&&res[0].ok){ recordStats("restore",1); toast("已恢复（进入 PicaPhoto 相册）"); }
      else toast("恢复失败");
    }catch(e){ toast("恢复失败："+e); }
  } else {
    const rec=appTrash.find(t=>t.id===m.id);
    if(rec){
      const obj={id:rec.id, name:rec.name, type:rec.mime, size:0, addedAt:Date.now(), album:null, blob:rec.blob};
      media.push(obj);
      await storePut("media",obj);
      await storeDel("trash",rec.id);
      recordStats("restore",1);
      toast("已恢复");
    }
  }
  await refreshTrash(); renderTrash();
  if(orgSub==="photos") renderPhotos();
  if(orgSub==="home") renderHome();
}
async function permanentDelete(m){
  if(m.fromPhone){
    try{ JSON.parse(BRIDGE.deleteTrash(JSON.stringify([m.uri]))); }catch(e){}
  } else {
    if(urls.has(m.id)){ URL.revokeObjectURL(urls.get(m.id)); urls.delete(m.id); }
    await storeDel("trash", m.id);
  }
  toast("已彻底删除");
  await refreshTrash(); renderTrash();
}
async function restoreAllTrash(){
  const apps=appTrash.slice(), ph=phoneTrash.slice();
  let n=0;
  for(const t of apps){
    const obj={id:t.id, name:t.name, type:t.mime, size:0, addedAt:Date.now(), album:null, blob:t.blob};
    media.push(obj); n++;
    await storePut("media",obj);
    await storeDel("trash",t.id);
  }
  if(ph.length && BRIDGE){
    try{ const r=JSON.parse(BRIDGE.restoreTrash(JSON.stringify(ph.map(t=>t.uri)))); n += r.filter(x=>x.ok).length; }catch(e){}
  }
  if(n) recordStats("restore", n);
  toast("已恢复 "+n+" 项");
  await refreshTrash(); renderTrash();
  if(orgSub==="photos") renderPhotos();
  if(orgSub==="home") renderHome();
}
async function emptyTrash(){
  if(!trashList.length) return;
  if(!confirm("确定清空回收站？此操作不可恢复。")) return;
  for(const m of trashList){
    if(m.fromPhone){ try{ JSON.parse(BRIDGE.deleteTrash(JSON.stringify([m.uri]))); }catch(e){} }
    else { if(urls.has(m.id)){ URL.revokeObjectURL(urls.get(m.id)); urls.delete(m.id); } await storeDel("trash",m.id); }
  }
  toast("回收站已清空");
  await refreshTrash(); renderTrash();
}

/* ============ 移入回收站 / 撤销（记录统计，不因删除清空整理） ============ */
async function trashOne(m){
  if(m.uri && m.uri.startsWith("content:")){
    try{
      const res=JSON.parse(BRIDGE.trashMedia(JSON.stringify([m.uri])));
      if(res[0]&&res[0].ok){
        lastTrashed={type:"phone", uri:m.uri, dst:res[0].dst};
        const idx=phoneMedia.indexOf(m); if(idx>=0) phoneMedia.splice(idx,1);
        recordStats("trash",1);
        toastTrash();
      } else toast("移入回收站失败");
    }catch(e){ toast("失败："+e); }
  } else {
    const tr={id:m.id, name:m.name, mime:m.type||"", isVideo:!!(m.type||"").startsWith("video/"), trashedAt:Date.now(), blob:m.blob};
    await storePut("trash",tr);
    await storeDel("media", m.id);
    const idx=media.indexOf(m); if(idx>=0) media.splice(idx,1);
    lastTrashed={type:"app", item:tr};
    recordStats("trash",1);
    toastTrash();
  }
  await refreshTrash();
}
function toastTrash(){
  toast("已移入回收站","撤销",()=>undoTrash());
}
async function undoTrash(){
  if(!lastTrashed) return;
  const t=lastTrashed; lastTrashed=null;
  if(t.type==="phone"){
    try{
      const res=JSON.parse(BRIDGE.restoreTrash(JSON.stringify([t.dst||t.uri])));
      if(res[0]&&res[0].ok){ recordStats("restore",1); refreshPhoneAlbums(); toast("已撤销"); }
      else toast("撤销失败");
    }catch(e){ toast("撤销失败："+e); }
  } else {
    const tr=t.item;
    const obj={id:tr.id, name:tr.name, type:tr.mime, size:0, addedAt:Date.now(), album:null, blob:tr.blob};
    media.push(obj);
    await storeDel("trash",tr.id);
    await storePut("media",obj);
    recordStats("restore",1);
    toast("已撤销");
  }
  await refreshTrash();
  if(orgSub==="photos") renderPhotos();
  if(orgSub==="home") renderHome();
  updateViewerChrome();
}
/* ============ 全屏查看器（窗口化渲染 + 邻居预加载，解决滑动黑屏 + 提速） ============ */
let viewerList=[], viewerIdx=0, viewerMode="normal", chromeShow=false;
let g=null, longT=null, lastTap=0, zoomed=false, chromeTimer=null;
let vSlots=[]; const VWIN=2;

function openViewer(list, idx, mode){
  viewerList=list; viewerIdx=idx; viewerMode=mode||"normal"; chromeShow=false; zoomed=false;
  $("#viewer").classList.add("open");
  buildSlides();
  setTrack(0,0,1,false);
  updateViewerChrome();
  document.body.style.overflow="hidden";
  showChrome(false);
  $("#vHint").classList.add("show");
  $("#vHint").textContent = mode==="trash" ? "↑ 上滑删除 · ↓ 下滑返回" : "↑ 上滑回收 · ↓ 下滑返回";
  setTimeout(()=>{ if($("#viewer").classList.contains("open")) $("#vHint").classList.remove("show"); },2200);
}
function closeViewer(){
  $("#viewer").classList.remove("open");
  document.body.style.overflow="";
  clearTimeout(longT); clearTimeout(chromeTimer); g=null;
  vSlots.forEach(s=>{ s.el.remove(); }); vSlots=[];
  if(orgSub==="photos") renderPhotos();
  if(orgSub==="trash") renderTrash();
}
function setTrack(dx, dy, sc, animate){
  const t=$("#vTrack");
  t.style.transition = animate ? "transform .32s cubic-bezier(.2,.8,.2,1)" : "none";
  t.style.transform = `translate(calc(${-viewerIdx*100}% + ${dx}px), ${dy}px) scale(${sc})`;
}
function buildSlides(){
  const track=$("#vTrack");
  const lo=Math.max(0,viewerIdx-VWIN), hi=Math.min(viewerList.length-1,viewerIdx+VWIN);
  const keep=new Set();
  for(let i=lo;i<=hi;i++){
    let slot=vSlots.find(s=>s.idx===i);
    if(!slot){
      const el=document.createElement("div"); el.className="slide";
      el.style.transform=`translateX(${i*100}%)`;
      track.appendChild(el);
      slot={idx:i, el}; vSlots.push(slot);
    }
    setSlideContent(slot.el, viewerList[i]);
    keep.add(slot);
  }
  vSlots=vSlots.filter(s=>{
    if(!keep.has(s)){ track.removeChild(s.el); return false; }
    return true;
  });
  preloadIdx(viewerIdx+VWIN+1);
  preloadIdx(viewerIdx-VWIN-1);
}
function setSlideContent(el, m){
  const src=objURL(m);
  if(isVideo(m)){
    let v=el.querySelector("video");
    if(!v){ el.innerHTML=`<video src="${src}" playsinline ${chromeShow?"controls":""}></video>`; }
    else if(v.src!==src){ v.src=src; }
    else v.controls=chromeShow;
  } else {
    let im=el.querySelector("img");
    if(!im){ el.innerHTML=`<img src="${src}" alt="" decoding="async">`; }
    else if(im.src!==src){ im.src=src; }
  }
}
function preloadIdx(i){
  if(i<0 || i>=viewerList.length) return;
  const m=viewerList[i]; if(!m) return;
  const src=m.uri || (m.blob ? objURL(m) : "");
  if(src){ const im=new Image(); im.src=src; }
}
function updateViewerChrome(){
  const m=viewerList[viewerIdx];
  if(!m) return;
  $("#vCount").textContent=(viewerIdx+1)+" / "+viewerList.length;
  const vb=$("#vBottom");
  if(viewerMode==="trash"){
    vb.innerHTML=`<button class="v-btn" id="vRestore">↩️<span>恢复</span></button>
                  <button class="v-btn danger" id="vDel">🗑️<span>删除</span></button>`;
    $("#vRestore").addEventListener("click", async ()=>{
      const mm=viewerList[viewerIdx];
      await restoreFromTrash(mm);
      viewerList.splice(viewerIdx,1); afterViewerRemove();
    });
    $("#vDel").addEventListener("click", async ()=>{
      const mm=viewerList[viewerIdx];
      await permanentDelete(mm);
      viewerList.splice(viewerIdx,1); afterViewerRemove();
    });
  } else {
    const f=isFav(m);
    vb.innerHTML=`<button class="v-btn ${f?'on':''}" id="vFav">${f?'♥':'♡'}<span>${f?'已收藏':'收藏'}</span></button>
                  <button class="v-btn" id="vUndo" style="${lastTrashed?'':'display:none'}">↩️<span>撤销</span></button>
                  <button class="v-btn" id="vAlbum">📁<span>移动</span></button>`;
    $("#vFav").addEventListener("click", ()=>{ toggleFav(viewerList[viewerIdx]); });
    $("#vUndo").addEventListener("click", ()=>{ undoTrash(); });
    $("#vAlbum").addEventListener("click", ()=>{ moveCurrent(); });
  }
}
function afterViewerRemove(){
  if(!viewerList.length){ closeViewer(); return; }
  if(viewerIdx>=viewerList.length) viewerIdx=viewerList.length-1;
  buildSlides();
  setTrack(0,0,1,false);
  updateViewerChrome();
}
function moveViewer(step){
  const ni=Math.max(0,Math.min(viewerList.length-1,viewerIdx+step));
  if(ni===viewerIdx){ setTrack(0,0,1,true); return; }
  viewerIdx=ni; zoomed=false;
  buildSlides();
  setTrack(0,0,1,true);
  updateViewerChrome();
}
function moveCurrent(){
  const m=viewerList[viewerIdx];
  if(!m) return;
  if(m.uri && m.uri.startsWith("content:")){
    const opts=albums.map(a=>({ic:"📁",t:a.name,f:()=>{ nativeMove(a.name,[m]); closeViewer(); }}));
    opts.push({ic:"➕",t:"新建相册…",f:()=>promptInput("新建相册","",async v=>{ if(v){ nativeMove(v,[m]); closeViewer(); } })});
    sheet(opts,"移动到相册"); return;
  }
  const opts=[{ic:"🗂️",t:"移回未整理",f:async ()=>{ m.album=null; await storePut("media",m); recordStats("move",1); toast("已移动"); }},
    ...albums.map(a=>({ic:"📁",t:a.name,f:async ()=>{ m.album=a.id; await storePut("media",m); recordStats("move",1); toast("已移动到「"+a.name+"」"); }}))];
  sheet(opts,"移动到相册");
}

/* ---- 手势：左右切换 / 上滑回收 / 下滑返回 / 点按工具栏 / 长按 Peek ---- */
$("#viewer").addEventListener("touchstart", e=>{
  if(e.touches.length>1) return;
  const t=e.touches[0];
  g={mode:null, sx:t.clientX, sy:t.clientY, dx:0, dy:0, moved:false, t0:Date.now(), long:false};
  clearTimeout(longT);
  longT=setTimeout(()=>{
    if(g && !g.moved && g.mode===null){
      g.long=true; vibrate(12);
      const cur=vSlots.find(s=>s.idx===viewerIdx);
      if(cur) cur.el.classList.add("peek");
      $("#vHint").classList.add("show");
      $("#vHint").textContent = viewerMode==="trash" ? "↑ 上滑删除 · ↓ 下滑返回" : "↑ 上滑回收 · ↓ 下滑返回";
    }
  },360);
},{passive:true});

$("#viewer").addEventListener("touchmove", e=>{
  if(!g) return;
  const t=e.touches[0];
  const dx=t.clientX-g.sx, dy=t.clientY-g.sy;
  if(g.mode===null){
    if(Math.abs(dx)>14 || Math.abs(dy)>14){
      g.mode = Math.abs(dy)>Math.abs(dx) ? "v" : "h";
      if(g.mode==="h"){ clearTimeout(longT); const cur=vSlots.find(s=>s.idx===viewerIdx); if(cur) cur.el.classList.remove("peek"); $("#vHint").classList.remove("show"); }
    }
  }
  if(g.mode===null) return;
  e.preventDefault();
  g.dx=dx; g.dy=dy; g.moved=true;
  if(g.mode==="h"){
    setTrack(dx, 0, 1, false);
  } else {
    const cy=Math.max(-320,Math.min(320,dy));
    const sc=Math.max(.86, 1-Math.abs(cy)/1400);
    setTrack(0, cy, sc, false);
    const zone=$("#vTrashZone");
    zone.classList.toggle("show", viewerMode==="normal" && cy<-70);
    $("#vHint").classList.toggle("show", !(cy<-70));
    if(cy<-70) $("#vHint").textContent="松手移入回收站";
    else if(cy>80) $("#vHint").textContent="松手返回";
    else $("#vHint").textContent = viewerMode==="trash" ? "↑ 上滑删除 · ↓ 下滑返回" : "↑ 上滑回收 · ↓ 下滑返回";
  }
},{passive:false});

$("#viewer").addEventListener("touchend", e=>{
  clearTimeout(longT);
  if(!g) return;
  const g0=g; g=null;
  const cur=vSlots.find(s=>s.idx===viewerIdx);
  if(cur) cur.el.classList.remove("peek");
  $("#vHint").classList.remove("show");
  $("#vTrashZone").classList.remove("show");
  if(g0.long && g0.mode==="v"){
    if(g0.dy<-70) doTrashCurrent();
    else if(g0.dy>70) closeViewer();
    else setTrack(0,0,1,true);
    return;
  }
  if(g0.mode==="h"){
    if(g0.dx<-60) moveViewer(1);
    else if(g0.dx>60) moveViewer(-1);
    else setTrack(0,0,1,true);
    return;
  }
  if(g0.mode==="v"){
    if(g0.dy<-70){
      setTrack(0,-120,.9,true);
      setTimeout(()=>doTrashCurrent(),200);
    } else if(g0.dy>70){
      setTrack(0,120,1,true);
      setTimeout(()=>closeViewer(),200);
    } else {
      setTrack(0,0,1,true);
    }
    return;
  }
  const now=Date.now();
  if(!g0.moved && now-g0.t0<350){
    if(now-lastTap<300){
      zoomed=!zoomed;
      const s=vSlots.find(x=>x.idx===viewerIdx);
      if(s) s.el.classList.toggle("zoomed", zoomed);
      lastTap=0;
    } else {
      lastTap=now;
      toggleChrome();
    }
  }
},{passive:true});

$("#viewer").addEventListener("touchcancel", ()=>{
  clearTimeout(longT); g=null;
  const cur=vSlots.find(s=>s.idx===viewerIdx); if(cur) cur.el.classList.remove("peek");
  $("#vHint").classList.remove("show"); $("#vTrashZone").classList.remove("show");
});
$("#vClose").addEventListener("click", closeViewer);

async function doTrashCurrent(){
  const m=viewerList[viewerIdx];

  if(viewerMode==="trash"){
    await permanentDelete(m);

  }

  afterViewerRemove();
}

/* ============ 我的：统计 / 日历 / 存储 / 设置 ============ */
function monthTotal(){
  const y=calYear, m=calMonth;
  const days=new Date(y,m+1,0).getDate();
  let n=0;
  for(let d=1;d<=days;d++){
    const key=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    n += stats.organizedByDay[key]||0;
  }
  return n;
}
function renderCalendar(){
  const y=calYear, m=calMonth;
  const first=new Date(y,m,1);
  const startDow=(first.getDay()+6)%7;
  const days=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const prevM = m===0 ? 11 : m-1, prevY = m===0 ? y-1 : y;
  const nextM = m===11 ? 0 : m+1, nextY = m===11 ? y+1 : y;
  let html="";
  for(let i=0;i<startDow;i++){
    const d=prevDays-startDow+i+1;
    const key=prevY+"-"+String(prevM+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    html+=calCell(key,d,stats.organizedByDay[key]||0,true);
  }
  for(let d=1;d<=days;d++){
    const key=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    html+=calCell(key,d,stats.organizedByDay[key]||0,false);
  }
  const total=startDow+days, rem=(7-total%7)%7;
  for(let i=1;i<=rem;i++){
    const key=nextY+"-"+String(nextM+1).padStart(2,"0")+"-"+String(i).padStart(2,"0");
    html+=calCell(key,i,stats.organizedByDay[key]||0,true);
  }
  const g=$("#calGrid"); if(g) g.innerHTML=html;
  const t=$("#calTitle"); if(t) t.textContent=y+" 年 "+(m+1)+" 月";
  const mt=$("#calMonthTotal"); if(mt) mt.textContent="本月整理 "+monthTotal()+" 张";
}
function calCell(key,d,n,muted){
  const lvl = n===0 ? 0 : (n<3?1 : (n<6?2 : 3));
  return `<div class="cal-day lvl${lvl}${muted?' muted':''}" title="${key}">${d}${n?'<b>'+n+'</b>':''}</div>`;
}

  $("#rowTheme").addEventListener("click", ()=>{ sheet([{ic:"🌗",t:"跟随系统",f:()=>{theme="auto";localStorage.setItem("pp_theme","auto");applyTheme();renderMe();}},
      {ic:"☀️",t:"浅色",f:()=>{theme="light";localStorage.setItem("pp_theme","light");applyTheme();renderMe();}},
      {ic:"🌙",t:"深色",f:()=>{theme="dark";localStorage.setItem("pp_theme","dark");applyTheme();renderMe();}}],"主题"); });
  $("#rowClean").addEventListener("click", clearStorage);
  $("#rowUpdate").addEventListener("click", ()=>checkUpdate(true));

async function clearStorage(){
  if(!confirm("确定清理 App 内的照片/视频？\n整理记录、收藏和设置会完整保留。")) return;
  await new Promise(r=>{ tx("media","readwrite").clear().onsuccess=r; });
  await new Promise(r=>{ tx("albums","readwrite").clear().onsuccess=r; });
  await new Promise(r=>{ tx("trash","readwrite").clear().onsuccess=r; });
  media=[]; albums=[]; appTrash=[]; trashList=[];
  urls.forEach(u=>URL.revokeObjectURL(u)); urls.clear();
  await refreshTrash();
  toast("已清理，整理记录已保留");
  if(tab==="me") renderMe(); else saveState();
}

/* ============ 自动更新 ============ */
function cmpVer(a,b){
  const pa=(a||"").split(".").map(Number), pb=(b||"").split(".").map(Number);
  for(let i=0;i<3;i++){ const x=pa[i]||0, y=pb[i]||0; if(x!==y) return x-y; }
  return 0;
}
let updateDismissed=null;
async function checkUpdate(force){
  try{
    const r=await fetch(GITHUB_API,{cache:"no-store"});
    if(!r.ok){ if(force) toast("检查更新失败"); return; }
    const rel=await r.json();
    const apks=(rel.assets||[]).filter(a=>/PicaPhoto_v\d+\.\d+\.\d+\.apk/i.test(a.name));
    apks.sort((a,b)=>{ const va=(a.name.match(/v(\d+\.\d+\.\d+)/i)||[])[1], vb=(b.name.match(/v(\d+\.\d+\.\d+)/i)||[])[1]; return cmpVer(vb,va); });
    const asset=apks[0];
    if(!asset){ if(force) toast("未找到安装包"); return; }
    const ver=(asset.name.match(/PicaPhoto_v(\d+\.\d+\.\d+)/i)||[])[1];
    if(!ver){ if(force) toast("版本信息异常"); return; }
    if(cmpVer(ver,APP_VERSION)<=0){ if(force) toast("已是最新版本 v"+APP_VERSION); return; }
    if(updateDismissed===ver) return;
    updateDismissed=ver;
    $("#updVer").textContent="v"+ver+"（当前 v"+APP_VERSION+"）";
    $("#updLog").textContent=(rel.body||"暂无更新说明").trim();
    $("#updateDlg").classList.add("open");
    window._updUrl=asset.browser_download_url;
  }catch(e){ if(force) toast("检查更新失败，请检查网络"); }
}
$("#updLater").addEventListener("click", ()=>{ $("#updateDlg").classList.remove("open"); });
$("#updNow").addEventListener("click", ()=>{
  $("#updateDlg").classList.remove("open");
  const url=window._updUrl||"";
  if(!url) return;
  if(BRIDGE){ BRIDGE.downloadAndInstall(url); toast("正在下载新版本…"); }
  else { try{ window.open(url,"_blank"); }catch(e){ location.href=url; } }
});

}

  checkUpdate(false);   // 打开自动检测新版本
}
init();
